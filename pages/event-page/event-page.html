<main class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">{{ title }}</p>
      <h1>Event Gallery</h1>
      <p class="subtitle">
        A quick showcase of the event card component for the Samurai's Zenith board game.
      </p>
    </div>
    <div class="badge">Prototype Deck</div>
  </header>

  <div class="flex flex-row flex-wrap gap-4 p-4" aria-label="Samurai's Zenith events">
    @for(eventCard of allEvents; track eventCard){
    <div class="w-[300px]">
      <event-card [eventCardInfo]="eventCard"></event-card>
    </div>
    }

  </div>
</main>
