<main class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">{{ title }}</p>
      <h1>Town Gallery</h1>
      <p class="subtitle">
        A quick showcase of the town card component for the Samurai's Zenith board game.
      </p>
    </div>
    <div class="badge">Prototype Deck</div>
  </header>

  <div class="flex flex-row flex-wrap gap-4 p-4" aria-label="Samurai's Zenith towns">
    @for(townCard of allTowns; track townCard){
    <div class="w-[300px]">
      <town-card [townCardInfo]="townCard"></town-card>
    </div>
    }

  </div>
</main>
