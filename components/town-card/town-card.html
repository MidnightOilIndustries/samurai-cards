@if(townCardInfo){
<div class="town-card h-[500px]" aria-label="{{ townCardInfo.name }}">
    <div class="town-card-header w-full items-center">
        <div class="text-2xl title w-full text-center">
            <h2>{{ townCardInfo.name }}</h2>
        </div>
    </div>

    <div class="town-card-image w-full flex h-[200px] justify-center">
        <img [src]="townCardInfo.imageUrl" [alt]="townCardInfo.name" class="max-w-full h-auto">
    </div>

    <div class="town-card-body">
        <ul class="visit-options">
            @for(option of townCardInfo.visitOptions; track option){
            <li>{{ option.description }}</li>
            }
        </ul>
        @if(townCardInfo.flavor){
        <p class="flavor text-center">"{{ townCardInfo.flavor }}"</p>
        }
    </div>
</div>
}
